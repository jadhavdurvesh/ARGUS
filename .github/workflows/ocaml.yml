name: OCaml
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.2
      - run: opam install . --deps-only --with-test -y
      - run: opam exec -- dune build @all
      - run: opam exec -- dune runtest
